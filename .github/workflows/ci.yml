name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux (current packages)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    timeout-minutes: 45
    env:
      # Qt otherwise logs to the journal, which a container lacks, and a
      # failing test's own reasons never reach the log.
      QT_FORCE_STDERR_LOGGING: "1"
      # A desktop's locale and time zone: the clock tests read an unpadded
      # hour, and floating calendar times need a known zone.
      LANG: en_US.UTF-8
      TZ: UTC
    steps:
      - name: Install the build stack
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git python dbus \
            extra-cmake-modules qt6-base qt6-declarative \
            kcalendarcore kconfig kcoreaddons kiconthemes ki18n kitemmodels \
            kjobwidgets kio kservice kstatusnotifieritem kwindowsystem kxmlgui \
            kpackage libplasma plasma-workspace pulseaudio-qt libkscreen layer-shell-qt \
            powerdevil kdeclarative kcmutils kirigami ksvg breeze-icons \
            ttf-dejavu noto-fonts
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the repository checks
        run: ./verify.sh
